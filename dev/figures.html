<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figure styles</title>
<style>
  html, body { margin: 0; background: #efe9de; font-family: system-ui, sans-serif; }
  #out { display: block; max-width: 100%; height: auto; margin: 0 auto; }
  #gl { position: absolute; left: -9999px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="out" width="1500" height="900"></canvas>
<script type="module">
// Dev page: five ways to draw the children, side by side, in the same little scene and light as the app.
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const PW = 500, PH = 450;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(2); renderer.setSize(PW, PH);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.domElement.id = 'gl'; document.body.append(renderer.domElement);

const scene = new THREE.Scene(); scene.background = new THREE.Color('#e9f1f2');
scene.add(new THREE.HemisphereLight('#ffffff', '#d9d3c5', 1.35));
const sun = new THREE.DirectionalLight('#fff4e2', 2.1); sun.position.set(2, 5, 3); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -2, right: 2, top: 2, bottom: -2 }); sun.shadow.bias = -0.0004; scene.add(sun);
const V = 0.5, cam = new THREE.OrthographicCamera(-V * PW / PH, V * PW / PH, V, -V, -10, 20);
cam.position.set(2.2, 2.1, 4.2); cam.lookAt(0.02, 0.12, 0.02);

const mats = new Map();
const mat = (hex, extra = {}) => { const k = hex + JSON.stringify(extra); if (!mats.has(k)) mats.set(k, new THREE.MeshLambertMaterial({ color: hex, ...extra })); return mats.get(k); };
const mesh = (geo, m, shadow = true) => { const x = new THREE.Mesh(geo, m); x.castShadow = shadow; x.receiveShadow = true; return x; };
const INK = new THREE.MeshBasicMaterial({ color: '#2a2c31', side: THREE.BackSide });
// An outline: the same shape a touch fatter, drawn inside-out in dark grey.
function inked(geo, m, w = 0.0045) {
  const g = new THREE.Group(), h = geo.clone(), p = h.attributes.position, n = h.attributes.normal;
  for (let i = 0; i < p.count; i++) p.setXYZ(i, p.getX(i) + n.getX(i) * w, p.getY(i) + n.getY(i) * w, p.getZ(i) + n.getZ(i) * w);
  g.add(mesh(geo, m), new THREE.Mesh(h, INK)); return g;
}

// A little bit of school round every set of children: floor, a yellow wall with a window, a round table, a tree.
const set = new THREE.Group(); scene.add(set);
set.add(mesh(new THREE.BoxGeometry(3, 0.04, 3).translate(0, -0.02, 0), mat('#efe9de')));
set.add(mesh(new THREE.BoxGeometry(1.6, 0.5, 0.06).translate(0, 0.25, -0.5), mat('#f4c23d')));
const win = mesh(new THREE.BoxGeometry(0.3, 0.22, 0.02).translate(-0.35, 0.26, -0.465), mat('#cfeaf5')); set.add(win);
set.add(mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.015, 28).translate(0.36, 0.075, -0.18), mat('#22b2bf')));
set.add(mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.075, 8).translate(0.36, 0.0375, -0.18), mat('#fbfaf6')));
set.add(mesh(new THREE.SphereGeometry(0.13, 16, 12).translate(0.62, 0.32, -0.36), mat('#5fae4e')));
set.add(mesh(new THREE.CylinderGeometry(0.015, 0.02, 0.2, 8).translate(0.62, 0.1, -0.36), mat('#8a5a3c')));
const stool = mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.045, 16).translate(0.2, 0.0225, -0.1), mat('#e2457d')); set.add(stool);

const CLOTHES = ['#f4c23d', '#e6463c', '#22b2bf', '#e2457d', '#3d8de0', '#8bc34a', '#9a6cd4'];
const HAIR = ['#3b2a20', '#1f1b18', '#b5652e', '#e3b65a', '#6b4128'];
const SKIN = ['#f6d7bf', '#e7b892', '#c98c62', '#9a6544', '#6e4630'];
// The five poses in every panel: waving, walking, sitting on the stool, running, standing with a bag.
const POSES = [
  { at: [-0.42, 0.12], yaw: 0.3, wave: true },
  { at: [-0.12, 0.26], yaw: 0.9, walk: 0.5 },
  { at: [0.2, -0.1], yaw: 0.4, sit: true },
  { at: [0.42, 0.22], yaw: -0.8, walk: 0.9, run: true },
  { at: [-0.02, -0.18], yaw: 0.1, bag: true },
];

// ---------- the five styles ----------
// Each returns a child (feet at y = 0, facing +z) in a pose.
function limbs(g, P, opt) {
  // Legs and arms that swing like the app's people.
  const { hip, sh, legGeo, armGeo, legM, armM, ink, sx = 0.014, ax = 0.033 } = opt;
  const L = [], A = [];
  for (const s of [-1, 1]) {
    const leg = new THREE.Group(); leg.position.set(s * sx, hip, 0); leg.add(ink ? inked(legGeo, legM) : mesh(legGeo, legM)); g.add(leg); L.push(leg);
    const arm = new THREE.Group(); arm.position.set(s * ax, sh, 0); arm.add(ink ? inked(armGeo, armM) : mesh(armGeo, armM)); g.add(arm); A.push(arm);
  }
  const sw = P.walk || 0;
  L[0].rotation.x = sw; L[1].rotation.x = -sw; A[0].rotation.x = -sw * 0.9; A[1].rotation.x = sw * 0.9;
  A[0].rotation.z = -0.12; A[1].rotation.z = 0.12;
  if (P.sit) { L[0].rotation.x = L[1].rotation.x = -1.45; A[0].rotation.x = A[1].rotation.x = -0.6; }
  if (P.wave) { A[1].rotation.z = 2.7; A[1].rotation.x = 0; }
  if (P.run) g.rotation.x = 0.16;
  return { L, A };
}
const STYLES = [
  { name: 'A  Pencil (now)', note: 'White with a pencil outline, like an architect’s drawing', make(P, i) {
    const g = new THREE.Group(), white = mat('#ffffff'), tint = mat(['#ffffff', '#fde3ea', '#fdf1cf', '#dff3f5', '#e9f5dc'][i % 5]);
    g.add(inked(new THREE.CylinderGeometry(0.025, 0.035, 0.078, 14).translate(0, 0.107, 0), tint));
    g.add(inked(new THREE.SphereGeometry(0.035, 16, 12).translate(0, 0.181, 0), white));
    limbs(g, P, { hip: 0.068, sh: 0.136, legGeo: new THREE.CylinderGeometry(0.0115, 0.0095, 0.068, 8).translate(0, -0.034, 0), armGeo: new THREE.CylinderGeometry(0.0095, 0.008, 0.062, 8).translate(0, -0.031, 0), legM: white, armM: white, ink: true });
    return g;
  } },
  { name: 'B  Colour pencil', note: 'Same outline, but bright clothes and hair', make(P, i) {
    const g = new THREE.Group(), white = mat('#ffffff'), top = mat(CLOTHES[i % CLOTHES.length]), hair = mat(HAIR[i % HAIR.length]), legs = mat(i % 2 ? '#2f4b7c' : '#3d405b');
    g.add(inked(new THREE.CylinderGeometry(0.026, 0.035, 0.078, 14).translate(0, 0.107, 0), top));
    g.add(inked(new THREE.SphereGeometry(0.036, 16, 12).translate(0, 0.183, 0), white));
    g.add(inked(new THREE.SphereGeometry(0.039, 16, 10, 0, Math.PI * 2, 0, Math.PI * 0.55).rotateX(-0.35).translate(0, 0.186, -0.004), hair, 0.003));
    if (i % 3 === 1) g.add(inked(new THREE.SphereGeometry(0.017, 10, 8).translate(0, 0.222, -0.02), hair, 0.003));
    limbs(g, P, { hip: 0.068, sh: 0.136, legGeo: new THREE.CylinderGeometry(0.0115, 0.0095, 0.068, 8).translate(0, -0.034, 0), armGeo: new THREE.CylinderGeometry(0.0095, 0.008, 0.062, 8).translate(0, -0.031, 0), legM: legs, armM: top, ink: true });
    if (P.bag) g.add(inked(new RoundedBoxGeometry(0.045, 0.05, 0.022, 2, 0.008).translate(0, 0.11, -0.04), mat('#e6463c'), 0.003));
    return g;
  } },
  { name: 'C  Wooden peg people', note: 'Like painted peg dolls – they match Finn’s wooden blocks', make(P, i) {
    const g = new THREE.Group(), wood = mat('#e8c9a0'), paint = mat(CLOTHES[i % CLOTHES.length]), hair = mat(HAIR[i % HAIR.length]);
    const prof = [[0, 0], [0.032, 0], [0.037, 0.012], [0.035, 0.05], [0.029, 0.09], [0.031, 0.112], [0.022, 0.13], [0, 0.13]].map(([r, y]) => new THREE.Vector2(r, y));
    g.add(mesh(new THREE.LatheGeometry(prof, 24), paint));
    g.add(mesh(new THREE.SphereGeometry(0.037, 20, 14).translate(0, 0.165, 0), wood));
    g.add(mesh(new THREE.SphereGeometry(0.039, 20, 10, 0, Math.PI * 2, 0, Math.PI * 0.5).rotateX(-0.45).translate(0, 0.168, -0.004), hair));
    for (const s of [-1, 1]) g.add(mesh(new THREE.SphereGeometry(0.0045, 6, 4).translate(s * 0.012, 0.168, 0.035), mat('#2a2c31'), false));
    g.add(mesh(new THREE.TorusGeometry(0.03, 0.004, 6, 20).rotateX(Math.PI / 2).translate(0, 0.06, 0), mat('#fbfaf6')));
    if (P.sit) g.position.y = 0.045;
    if (P.wave) g.rotation.z = 0.15;
    if (P.run) g.rotation.x = 0.2;
    if (P.bag) g.add(mesh(new RoundedBoxGeometry(0.045, 0.05, 0.022, 2, 0.008).translate(0, 0.08, -0.04), mat('#e6463c')));
    return g;
  } },
  { name: 'D  Toy kids', note: 'Chunky little toys with hair, faces and shoes', make(P, i) {
    const g = new THREE.Group(), skin = mat(SKIN[i % SKIN.length]), top = mat(CLOTHES[(i + 2) % CLOTHES.length]), hair = mat(HAIR[(i + 1) % HAIR.length]), shorts = mat(i % 2 ? '#2f4b7c' : '#ea7b2c');
    g.add(mesh(new RoundedBoxGeometry(0.066, 0.062, 0.044, 3, 0.016).translate(0, 0.1, 0), top));
    g.add(mesh(new RoundedBoxGeometry(0.062, 0.026, 0.042, 2, 0.01).translate(0, 0.064, 0), shorts));
    g.add(mesh(new THREE.SphereGeometry(0.042, 20, 14).translate(0, 0.17, 0), skin));
    g.add(mesh(new THREE.SphereGeometry(0.0445, 20, 10, 0, Math.PI * 2, 0, Math.PI * 0.5).rotateX(-0.5).translate(0, 0.172, -0.004), hair));
    if (i % 3 === 0) for (const s of [-1, 1]) g.add(mesh(new THREE.SphereGeometry(0.014, 10, 8).translate(s * 0.042, 0.18, -0.01), hair));
    if (i % 3 === 1) g.add(mesh(new THREE.SphereGeometry(0.018, 10, 8).translate(0, 0.21, -0.03), hair));
    for (const s of [-1, 1]) {
      g.add(mesh(new THREE.SphereGeometry(0.005, 6, 4).translate(s * 0.014, 0.172, 0.04), mat('#2a2c31'), false));
      g.add(mesh(new THREE.SphereGeometry(0.007, 6, 4).scale(1, 0.6, 0.4).translate(s * 0.024, 0.16, 0.036), mat('#f39aa0'), false));
    }
    const legGeo = new THREE.CylinderGeometry(0.011, 0.01, 0.05, 8).translate(0, -0.025, 0);
    const shoe = new RoundedBoxGeometry(0.022, 0.014, 0.032, 2, 0.006).translate(0, -0.054, 0.006);
    const { L, A } = limbs(g, P, { hip: 0.056, sh: 0.125, sx: 0.016, ax: 0.04, legGeo, armGeo: new THREE.CylinderGeometry(0.0105, 0.009, 0.05, 8).translate(0, -0.025, 0), legM: skin, armM: top });
    for (const l of L) l.add(mesh(shoe, mat('#fbfaf6')));
    for (const a of A) a.add(mesh(new THREE.SphereGeometry(0.0105, 8, 6).translate(0, -0.054, 0), skin));
    if (P.bag) g.add(mesh(new RoundedBoxGeometry(0.05, 0.055, 0.024, 2, 0.009).translate(0, 0.105, -0.036), mat('#22b2bf')));
    return g;
  } },
  { name: 'E  Monument Valley', note: 'Simple cone people with white pointy hats', make(P, i) {
    const g = new THREE.Group(), body = mat(CLOTHES[(i + 4) % CLOTHES.length]);
    for (const s of [-1, 1]) { const leg = mesh(new THREE.CylinderGeometry(0.005, 0.005, 0.05, 6).translate(0, -0.025, 0), mat('#2a2c31')); leg.position.set(s * 0.012, 0.05, 0); leg.rotation.x = (P.walk || 0) * s; if (P.sit) leg.rotation.x = -1.45; g.add(leg); }
    g.add(mesh(new THREE.ConeGeometry(0.042, 0.11, 20).translate(0, 0.095, 0), body));
    g.add(mesh(new THREE.SphereGeometry(0.028, 18, 12).translate(0, 0.168, 0), mat('#fbfaf6')));
    g.add(mesh(new THREE.ConeGeometry(0.031, 0.075, 18).translate(0, 0.222, 0), mat('#fbfaf6')));
    if (P.sit) g.position.y = 0.045 - 0.0;
    if (P.run) g.rotation.x = 0.2;
    if (P.wave) g.rotation.z = 0.15;
    return g;
  } },
];

const out = document.getElementById('out'), ctx = out.getContext('2d');
ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, out.width, out.height);
const groups = STYLES.map((S, si) => {
  const grp = new THREE.Group();
  POSES.forEach((P, i) => {
    const k = S.make(P, i + si);
    const holder = new THREE.Group(); holder.add(k);
    holder.position.set(P.at[0], P.sit ? 0 : 0, P.at[1]); holder.rotation.y = P.yaw;
    if (P.sit) { holder.position.set(0.2, 0, -0.1); if (si < 2 || si === 3) k.position.y = 0.045 + (si === 3 ? 0.012 : 0); }
    grp.add(holder);
  });
  grp.visible = false; scene.add(grp); return grp;
});
const cells = [[0, 0], [1, 0], [2, 0], [0, 1], [1, 1]];
STYLES.forEach((S, si) => {
  groups.forEach((g, j) => (g.visible = j === si));
  renderer.render(scene, cam);
  const [cx, cy] = cells[si];
  ctx.drawImage(renderer.domElement, cx * PW, cy * PH, PW, PH);
  ctx.fillStyle = 'rgba(255,255,255,0.88)'; ctx.fillRect(cx * PW, cy * PH, PW, 64);
  ctx.fillStyle = '#23252b'; ctx.font = '700 24px system-ui, sans-serif'; ctx.fillText(S.name, cx * PW + 16, cy * PH + 30);
  ctx.font = '15px system-ui, sans-serif'; ctx.fillStyle = '#555'; ctx.fillText(S.note, cx * PW + 16, cy * PH + 53);
});
// The last cell: how they look small, at the size they are on the whole-site view.
{
  const cx = 2, cy = 1, x0 = cx * PW, y0 = cy * PH;
  ctx.fillStyle = '#f6f3ee'; ctx.fillRect(x0, y0, PW, PH);
  ctx.fillStyle = '#23252b'; ctx.font = '700 24px system-ui, sans-serif'; ctx.fillText('At site size', x0 + 16, y0 + 30);
  ctx.font = '15px system-ui, sans-serif'; ctx.fillStyle = '#555'; ctx.fillText('How each one reads when it is small', x0 + 16, y0 + 53);
  STYLES.forEach((S, si) => {
    groups.forEach((g, j) => (g.visible = j === si));
    renderer.render(scene, cam);
    const w = 150, hgt = 135, col = si % 3, row = Math.floor(si / 3);
    ctx.drawImage(renderer.domElement, x0 + 18 + col * 158, y0 + 75 + row * 175, w, hgt);
    ctx.fillStyle = '#23252b'; ctx.font = '700 15px system-ui, sans-serif'; ctx.fillText(S.name.split(' ')[0], x0 + 22 + col * 158, y0 + 75 + row * 175 + hgt + 18);
  });
}
for (let i = 1; i < 3; i++) { ctx.fillStyle = '#ffffff'; ctx.fillRect(i * PW - 2, 0, 4, out.height); }
ctx.fillRect(0, PH - 2, out.width, 4);
window.__done = true;
window.__shot = async name => { const blob = await new Promise(r => out.toBlob(r, 'image/jpeg', 0.9)); return (await fetch('/__shot/' + name, { method: 'PUT', body: blob })).status; };
</script>
</body>
</html>
